{{- $alt := trim (.Text | plainify) " \t\n\r" -}}
{{- if or (eq $alt "") (in .Destination "avatar.png") -}}
<img src="{{ .Destination | safeURL }}" alt="{{ $alt }}"{{ with .Title }} title="{{ . }}"{{ end }}>
{{- else -}}
<figure style="margin: 2rem auto; text-align: center;">
  <img src="{{ .Destination | safeURL }}" alt="{{ $alt }}"{{ with .Title }} title="{{ . }}"{{ end }} style="margin: 0 auto;">
  <figcaption style="margin-top: 0.5rem; font-size: 0.9rem; font-style: italic; color: #555;">{{ $alt }}</figcaption>
</figure>
{{- end -}}
